<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Wangpan — AI Product Manager</title>
  <desc id="desc">Story to system to product</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090c"/>
      <stop offset="0.55" stop-color="#11101a"/>
      <stop offset="1" stop-color="#171326"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#725cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#725cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1015" cy="95" r="220" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1082" cy="85" r="10" fill="#d9ff43"/>
  <path d="M884 110c63-40 142-47 214-18" fill="none" stroke="#d9ff43" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  <rect x="62" y="55" width="168" height="34" rx="17" fill="#d9ff43"/>
  <text x="146" y="78" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#0d0d10" letter-spacing="2">AI PRODUCT</text>
  <text x="62" y="165" font-family="Arial, 'PingFang SC', sans-serif" font-size="62" font-weight="750" fill="#f5f3ed">王攀 · Wangpan</text>
  <text x="62" y="225" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="500" fill="#c9c5d5">把故事感，做成可用的 AI 产品。</text>
  <text x="62" y="282" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#8f8b9b" letter-spacing="1">STORY  →  SYSTEM  →  PRODUCT</text>
  <g transform="translate(62 330)">
    <rect width="120" height="34" rx="17" fill="#725cff"/>
    <text x="60" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white">AI AGENT</text>
    <rect x="132" width="96" height="34" rx="17" fill="#1d1c24" stroke="#4b4856"/>
    <text x="180" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e9e7ee">AIGC</text>
    <rect x="240" width="118" height="34" rx="17" fill="#1d1c24" stroke="#4b4856"/>
    <text x="299" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e9e7ee">AI CODING</text>
    <rect x="370" width="130" height="34" rx="17" fill="#1d1c24" stroke="#4b4856"/>
    <text x="435" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e9e7ee">PRODUCT UX</text>
  </g>
  <g transform="translate(870 165)">
    <rect width="252" height="144" rx="22" fill="#14131a" stroke="#3b374b"/>
    <circle cx="29" cy="27" r="6" fill="#ff6b6b"/><circle cx="49" cy="27" r="6" fill="#ffd166"/><circle cx="69" cy="27" r="6" fill="#53d28a"/>
    <text x="25" y="77" font-family="Menlo, monospace" font-size="14" fill="#8f8b9b">wangpan.build(</text>
    <text x="25" y="103" font-family="Menlo, monospace" font-size="14" fill="#d9ff43">  idea, empathy, AI</text>
    <text x="25" y="129" font-family="Menlo, monospace" font-size="14" fill="#8f8b9b">)</text>
  </g>
